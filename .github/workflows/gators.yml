name: Guardian Monitor - Gator's restock watch

on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub often runs this hours late, so each run keeps checking for ~5.5 hours
  workflow_dispatch:              # "Run workflow" button for a manual check
    inputs:
      test:
        description: "Send a TEST post to Discord (a fake restock, clearly marked)"
        type: boolean
        default: false
      resend:
        description: "Resend the most recent sealed restock alert"
        type: boolean
        default: false

concurrency:                     # the next run waits its turn, then takes over right away;
                                 # test/resend posts skip the line
  group: ${{ (github.event.inputs.test == 'true' || github.event.inputs.resend == 'true') && 'gators-manual' || 'gators-watch' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gators-bot
      - name: Remember what was in stock last time
        uses: actions/cache/restore@v4
        with:
          path: gators_state.json
          key: gators-state-${{ github.run_id }}
          restore-keys: gators-state-
      - name: Check Gator's Card Den
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_SINGLES: ${{ secrets.DISCORD_WEBHOOK_SINGLES }}
          GATORS_ROLE: ${{ vars.GATORS_ROLE }}
          GATORS_SINGLES_ROLE: ${{ vars.GATORS_SINGLES_ROLE }}
          GATORS_TEST: ${{ github.event.inputs.test || 'false' }}
          GATORS_RESEND: ${{ github.event.inputs.resend || 'false' }}
          GATORS_LOOP_MINUTES: "330"     # keep checking every ~3 min for 5.5 hours
          PYTHONUNBUFFERED: "1"
        run: python3 gators-bot/gators_bot.py
      - name: Save what's in stock now
        if: always() && github.event.inputs.test != 'true' && github.event.inputs.resend != 'true'
        uses: actions/cache/save@v4
        with:
          path: gators_state.json
          key: gators-state-${{ github.run_id }}
