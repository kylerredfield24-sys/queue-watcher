name: Guardian Monitor - keep it running

# GitHub pauses scheduled jobs in a repo that has had no changes for 60 days.
# This makes a tiny change every 2 weeks so that never happens.
on:
  schedule:
    - cron: "17 14 1,15 * *"     # the 1st and 15th of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gators-bot
      - name: Touch the keep-alive file
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > gators-bot/last_keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gators-bot/last_keepalive.txt
          git commit -m "Keep the restock watch running" || exit 0
          git push
